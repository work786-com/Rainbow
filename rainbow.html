<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rainbow Cursor Trail</title>
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  .hint{
    position:fixed;left:16px;bottom:16px;padding:8px 12px;border-radius:8px;
    background:rgba(255,255,255,0.03);color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial;
    font-size:13px;border:1px solid rgba(255,255,255,0.03);pointer-events:none;z-index:999;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Move your mouse or touch — rainbow appears where you point 🌈</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });
  let W = innerWidth, H = innerHeight;
  const DPR = Math.max(1, window.devicePixelRatio || 1);

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  // Particle system
  const particles = [];
  const cfg = {
    spawnPerMove: 6,      // how many particles per mousemove event
    baseSize: 8,          // base particle radius
    life: 900,            // ms lifetime
    hueSpeed: 0.12,       // hue change speed
    drift: 0.98,          // velocity damping
    gravity: 0.00         // small downward pull if you want
  };

  let pointer = { x: W/2, y: H/2, down: false };
  let lastMoveTime = performance.now();

  function spawn(x,y) {
    const t = performance.now();
    for (let i = 0; i < cfg.spawnPerMove; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.5 + Math.random() * 2.2;
      particles.push({
        x: x + (Math.random()-0.5) * 6,
        y: y + (Math.random()-0.5) * 6,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        born: t,
        life: cfg.life + Math.random()*300,
        size: cfg.baseSize * (0.6 + Math.random()*1.2),
        hueOffset: Math.random() * 360
      });
    }
  }

  // Mouse & touch
  window.addEventListener('mousemove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.down = true;
    lastMoveTime = performance.now();
    spawn(pointer.x, pointer.y);
  }, { passive: true });

  window.addEventListener('mousedown', (e) => { pointer.down = true; spawn(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener('mouseup', () => { pointer.down = false; }, { passive: true });

  window.addEventListener('touchstart', (e) => {
    if (!e.touches) return;
    const t0 = e.touches[0];
    pointer.x = t0.clientX; pointer.y = t0.clientY; pointer.down = true;
    spawn(pointer.x, pointer.y);
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (!e.touches) return;
    const t0 = e.touches[0];
    pointer.x = t0.clientX; pointer.y = t0.clientY;
    spawn(pointer.x, pointer.y);
  }, { passive: true });

  window.addEventListener('touchend', () => { pointer.down = false; }, { passive: true });

  // Animation loop
  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;

    // fade background slightly to create trailing effect
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0,0,W,H);

    // update & draw particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const age = now - p.born;
      const lifeRatio = Math.max(0, Math.min(1, age / p.life));

      if (age >= p.life) { particles.splice(i, 1); continue; }

      // dynamics
      p.vx *= cfg.drift;
      p.vy *= cfg.drift;
      p.vy += cfg.gravity * (dt / 16.67);
      p.x += p.vx * (dt / 16.67);
      p.y += p.vy * (dt / 16.67);

      // color cycles over time + per-particle offset
      const hue = ( (now * cfg.hueSpeed * 0.06) + p.hueOffset ) % 360;
      const sat = 90;
      const light = Math.max(45, 70 - lifeRatio * 50);

      // size and alpha falloff
      const size = p.size * (1 - lifeRatio * 0.9);
      const alpha = 1 - lifeRatio;

      // additive glowing draw
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 1.6);
      gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${Math.min(85, light)}%, ${alpha})`);
      gradient.addColorStop(0.3, `hsla(${hue}, ${sat}%, ${Math.max(45, light-12)}%, ${alpha*0.8})`);
      gradient.addColorStop(1, `hsla(${(hue+40)%360}, ${sat}%, ${Math.max(20, light-35)}%, 0)`);
      ctx.fillStyle = gradient;
      ctx.arc(p.x, p.y, size * 1.6, 0, Math.PI * 2);
      ctx.fill();

      // small bright core
      ctx.beginPath();
      ctx.fillStyle = `hsla(${hue}, ${sat}%, ${Math.min(95, light+10)}%, ${Math.min(1, alpha*1.2)})`;
      ctx.arc(p.x, p.y, Math.max(1, size * 0.35), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // slight screen-wrap safe cleanup (optional)
      if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) particles.splice(i,1);
    }

    // spawn gentle automatic particles while hovering/moving slowly (optional)
    if (pointer.down && now - lastMoveTime > 60) {
      // if mouse holds still, spawn a few to keep glow
      if (Math.random() < 0.4) spawn(pointer.x + (Math.random()-0.5)*12, pointer.y + (Math.random()-0.5)*12);
    }

    requestAnimationFrame(loop);
  }

  // Initial clear & start
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  requestAnimationFrame(loop);

  // small keyboard: press 'c' to clear
  window.addEventListener('keydown', (e) => {
    if (e.key === 'c' || e.key === 'C') {
      particles.length = 0;
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    }
  });
})();
</script>
</body>
</html>
